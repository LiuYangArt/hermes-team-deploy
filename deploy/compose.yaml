name: hermes-team-official
services:
  hermes-team:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HERMES_CORE_IMAGE: hermes-team-core:${HERMES_CORE_REVISION:?Set HERMES_CORE_REVISION}
      labels:
        org.opencontainers.image.revision: ${HERMES_CORE_REVISION:?Set HERMES_CORE_REVISION}
    image: hermes-team-official:${HERMES_CORE_REVISION:?Set HERMES_CORE_REVISION}
    container_name: hermes-team-new
    restart: unless-stopped
    env_file:
      - ${HERMES_TEAM_STATE_DIR:?Set HERMES_TEAM_STATE_DIR}/bot.env
    environment:
      HERMES_UID: ${HERMES_UID:?Set HERMES_UID}
      HERMES_GID: ${HERMES_GID:?Set HERMES_GID}
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_WRITE_SAFE_ROOT: /opt/data:/workspace
      MEEGLE_NO_UPDATE_CHECK: "1"
    volumes:
      - ${HERMES_TEAM_STATE_DIR}/data:/opt/data
      - ${HERMES_TEAM_STATE_DIR}/workspace:/workspace
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    tmpfs:
      - /tmp:exec,size=2g
    command: ["sleep", "infinity"]
